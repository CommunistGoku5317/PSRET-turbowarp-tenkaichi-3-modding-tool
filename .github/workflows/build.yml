name: Build Auto BT3 Desktop Modder

on:
  push:
    branches: [ main, master ]
    paths:
      - 'win-lin-app/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./win-lin-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Compila per ${{ matrix.os }}
        run: npx electron-builder --publish never

      - name: Carica eseguibili negli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BT3-Desktop-Modder-${{ matrix.os }}
          path: |
            win-lin-app/dist/*.exe
            win-lin-app/dist/*.AppImage
