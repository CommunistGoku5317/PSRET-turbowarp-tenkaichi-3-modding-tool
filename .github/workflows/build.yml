name: Build BT3 Desktop Modder v0.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Electron
        working-directory: ./win-mac-app
        run: npm install

      - name: Compila per Windows
        if: matrix.os == 'windows-latest'
        working-directory: ./win-mac-app
        run: npm run build-win

      - name: Compila per macOS
        if: matrix.os == 'macos-latest'
        working-directory: ./win-mac-app
        run: npx electron-builder --mac --publish never

      - name: Salva gli eseguibili pronti
        uses: actions/upload-artifact@v4
        with:
          name: BT3-Modder-${{ matrix.os }}
          path: |
            win-mac-app/dist/*.exe
            win-mac-app/dist/*.dmg
            win-mac-app/dist/*.zip
         
